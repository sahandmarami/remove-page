name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # /api/* uses server-side SDKs and cannot exist on a static host;
      # the client gracefully falls back to the fully offline local vision engine
      - name: Remove dev-only API routes
        run: rm -rf src/app/api

      - name: Build static site
        run: bun run build:static
        env:
          # custom domain serves the site at the ROOT (removepage.kdns.fr) —
          # no basePath needed anymore
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enabled: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
